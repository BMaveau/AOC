[project]
authors = [{name = "BMaveau", email = "benjamin.maveau@gmail.com"}]
dependencies = []
name = "AOC"
requires-python = ">= 3.11"
version = "0.1.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
aoc = { path = ".", editable = true }

[tool.pixi.tasks]

[tool.pixi.dependencies]
ruff = ">=0.17.3,<0.18"
ty = ">=0.0.96,<0.0.97"
networkx = ">=3.7,<4"
